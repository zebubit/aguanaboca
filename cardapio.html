<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio | Doceria Água na Boca</title>
<link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playball&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#C21A63; --pink-dark:#8C0F49; --pink-light:#F2A7C6;
    --gold:#E8A33D; --blush:#FFF3F6; --cream:#FFFDFB;
    --ink:#3A1420; --choco:#5C3324; --line:#F3D9E4;
    --shadow: 0 10px 30px rgba(140,15,73,.10);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Poppins,sans-serif;background:var(--blush);color:var(--ink);overflow-x:hidden;padding-bottom:90px}
  h1,h2,h3{margin:0;font-weight:800}
  p{margin:0}
  a{text-decoration:none;color:inherit}
  img{max-width:100%;display:block}

  /* topo */
  .topo{position:sticky;top:0;z-index:40;background:rgba(255,253,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topo-inner{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .topo img.logo{width:42px;height:42px;border-radius:50%}
  .topo .nome{font-size:15px;font-weight:800;line-height:1.15}
  .topo .nota{font-size:12px;color:var(--pink-dark);font-weight:600}
  .topo .voltar{margin-left:auto;font-size:13px;font-weight:600;color:var(--pink-dark);border:1.5px solid var(--pink-light);padding:7px 12px;border-radius:99px;white-space:nowrap}

  /* chips categoria */
  .chips-wrap{max-width:920px;margin:0 auto;padding:10px 16px 12px;overflow-x:auto;white-space:nowrap;-ms-overflow-style:none;scrollbar-width:none}
  .chips-wrap::-webkit-scrollbar{display:none}
  .chip{display:inline-block;padding:8px 16px;margin-right:8px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--choco)}
  .chip.ativo{background:var(--pink);border-color:var(--pink);color:#fff}

  main{max-width:920px;margin:0 auto;padding:6px 16px 40px}

  .aviso-min{background:#FFF7E9;border:1px solid #F4D9A0;color:#8A5A00;font-size:12.5px;padding:9px 14px;border-radius:12px;margin:6px 0 18px;text-align:center}

  section.categoria{margin-bottom:34px;scroll-margin-top:118px}
  .cat-titulo{font-family:Playball,cursive;font-size:30px;color:var(--pink-dark);margin-bottom:4px}
  .cat-linha{width:56px;height:3px;background:var(--gold);border-radius:3px;margin-bottom:16px}

  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}

  .card{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
  .card .foto{width:100%;aspect-ratio:4/3;object-fit:cover;background:linear-gradient(135deg,var(--pink-light),var(--gold))}
  .card .foto.placeholder{display:flex;align-items:center;justify-content:center;font-size:34px}
  .card .corpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card h3{font-size:15.5px;line-height:1.25}
  .card .desc{font-size:12.5px;color:#8A5D6C;line-height:1.4;min-height:0}
  .card .serve{font-size:11.5px;color:var(--gold);font-weight:700}
  .card .rodape-card{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px}
  .preco{display:flex;flex-direction:column;line-height:1.1}
  .preco .de{font-size:11px;color:#B98A9B;text-decoration:line-through}
  .preco .por{font-size:17px;font-weight:800;color:var(--pink-dark)}

  .stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--pink-light);border-radius:99px;overflow:hidden}
  .stepper button{width:30px;height:30px;border:none;background:#fff;color:var(--pink-dark);font-size:16px;font-weight:700;cursor:pointer}
  .stepper button:active{background:var(--blush)}
  .stepper .qtd{width:24px;text-align:center;font-size:13px;font-weight:700}
  .btn-add{background:var(--pink);color:#fff;border:none;border-radius:99px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn-add:active{background:var(--pink-dark)}

  /* sacola flutuante */
  .sacola-flutuante{position:fixed;left:16px;right:16px;bottom:16px;max-width:888px;margin:0 auto;background:var(--pink-dark);color:#fff;border-radius:18px;padding:14px 18px;display:none;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(140,15,73,.35);z-index:50;cursor:pointer}
  .sacola-flutuante.mostrar{display:flex}
  .sacola-flutuante .esq{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700}
  .sacola-flutuante .bolha{background:var(--gold);color:#3A2200;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800}
  .sacola-flutuante .dir{font-size:15px;font-weight:800}

  /* drawer */
  .overlay{position:fixed;inset:0;background:rgba(58,20,32,.45);z-index:60;display:none}
  .overlay.aberto{display:block}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:100%;max-width:420px;background:#fff;z-index:61;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
  .drawer.aberto{transform:translateX(0)}
  .drawer-topo{padding:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .drawer-topo h2{font-family:Playball,cursive;font-size:24px;color:var(--pink-dark);font-weight:400}
  .drawer-fechar{background:var(--blush);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--pink-dark)}
  .drawer-itens{flex:1;overflow-y:auto;padding:10px 18px}
  .drawer-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .drawer-item img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--blush)}
  .drawer-item .info{flex:1;display:flex;flex-direction:column;gap:4px}
  .drawer-item .info h4{font-size:13.5px;font-weight:700}
  .drawer-item .info .linha{display:flex;align-items:center;justify-content:space-between}
  .drawer-vazio{text-align:center;color:#B98A9B;font-size:13.5px;padding:60px 20px}
  .drawer-baixo{padding:16px 18px 20px;border-top:1px solid var(--line)}
  .linha-total{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;color:#8A5D6C}
  .linha-total.total{font-size:18px;font-weight:800;color:var(--pink-dark);margin-top:6px}
  .btn-whats{display:block;text-align:center;background:#25D366;color:#fff;font-weight:800;padding:14px;border-radius:14px;font-size:15px;margin-top:14px;border:none;width:100%;cursor:pointer}
  .btn-whats:disabled{background:#CFCFCF;cursor:not-allowed}
  .obs-min{font-size:11.5px;color:#8A5A00;text-align:center;margin-top:8px}

  .rodape-pag{max-width:920px;margin:24px auto 0;padding:0 16px;text-align:center;color:#B98A9B;font-size:12px}
</style>
</head>
<body>

<header class="topo">
  <div class="topo-inner">
    <img class="logo" src="img/logo.png" alt="Água na Boca">
    <div>
      <div class="nome">Doceria Água na Boca</div>
      <div class="nota">★ 4.6 · Pedido mínimo R$ 15,00</div>
    </div>
    <a class="voltar" href="index.html">← Site</a>
  </div>
  <div class="chips-wrap" id="chips"></div>
</header>

<main id="main"></main>

<div class="rodape-pag">Feito com carinho por <strong>zebubit.com.br</strong></div>

<div class="sacola-flutuante" id="sacolaFlutuante" onclick="abrirDrawer()">
  <div class="esq"><span class="bolha" id="bolhaQtd">0</span> Ver sacola</div>
  <div class="dir" id="totalFlutuante">R$ 0,00</div>
</div>

<div class="overlay" id="overlay" onclick="fecharDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-topo">
    <h2>Sua sacola</h2>
    <button class="drawer-fechar" onclick="fecharDrawer()">✕</button>
  </div>
  <div class="drawer-itens" id="drawerItens"></div>
  <div class="drawer-baixo">
    <div class="linha-total"><span>Subtotal</span><span id="subtotal">R$ 0,00</span></div>
    <div class="linha-total total"><span>Total</span><span id="total">R$ 0,00</span></div>
    <button class="btn-whats" id="btnWhats" onclick="finalizarPedido()">Fazer pedido no WhatsApp</button>
    <div class="obs-min" id="obsMin"></div>
  </div>
</div>

<script src="cardapio-dados.js"></script>
<script>
const CHAVE_CARRINHO = "agb_carrinho";
let carrinho = JSON.parse(localStorage.getItem(CHAVE_CARRINHO) || "{}");

function chaveItem(cat, nome){ return cat + "::" + nome; }

function salvarCarrinho(){
  localStorage.setItem(CHAVE_CARRINHO, JSON.stringify(carrinho));
  atualizarUI();
}

function alterarQtd(cat, item, delta){
  const k = chaveItem(cat, item.nome);
  const atual = carrinho[k]?.qtd || 0;
  const nova = Math.max(0, atual + delta);
  if(nova === 0){ delete carrinho[k]; }
  else { carrinho[k] = { nome: item.nome, preco: item.preco, img: item.img, qtd: nova }; }
  salvarCarrinho();
}

function montarPagina(){
  const main = document.getElementById("main");
  const chips = document.getElementById("chips");
  main.innerHTML = `<div class="aviso-min">Pedido mínimo R$ ${LOJA.pedidoMinimo.toFixed(2).replace(".",",")} · entrega e retirada combinadas pelo WhatsApp</div>`;

  CARDAPIO.forEach((grupo, gi) => {
    const idCat = "cat-" + gi;
    chips.innerHTML += `<a class="chip" href="#${idCat}">${grupo.categoria}</a>`;

    const sec = document.createElement("section");
    sec.className = "categoria";
    sec.id = idCat;
    sec.innerHTML = `<h2 class="cat-titulo">${grupo.categoria}</h2><div class="cat-linha"></div><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");

    grupo.itens.forEach(item => {
      const k = chaveItem(grupo.categoria, item.nome);
      const qtdAtual = carrinho[k]?.qtd || 0;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        ${item.img ? `<img class="foto" src="${item.img}" alt="${item.nome}">` : `<div class="foto placeholder">🍓</div>`}
        <div class="corpo">
          <h3>${item.nome}</h3>
          ${item.desc ? `<p class="desc">${item.desc}</p>` : ``}
          ${item.serve ? `<p class="serve">Serve ${item.serve}</p>` : ``}
          <div class="rodape-card">
            <div class="preco">
              ${item.precoDe ? `<span class="de">R$ ${item.precoDe.toFixed(2).replace(".",",")}</span>` : ``}
              <span class="por">R$ ${item.preco.toFixed(2).replace(".",",")}</span>
            </div>
            <div class="qtd-area" data-cat="${grupo.categoria}" data-nome="${item.nome}"></div>
          </div>
        </div>`;
      grid.appendChild(card);
      renderQtdArea(card.querySelector(".qtd-area"), grupo.categoria, item);
    });

    main.appendChild(sec);
  });
}

function renderQtdArea(el, cat, item){
  const k = chaveItem(cat, item.nome);
  const qtd = carrinho[k]?.qtd || 0;
  if(qtd === 0){
    el.innerHTML = `<button class="btn-add">Adicionar</button>`;
    el.querySelector("button").onclick = () => { alterarQtd(cat, item, 1); };
  } else {
    el.innerHTML = `<div class="stepper">
        <button data-op="-">−</button>
        <span class="qtd">${qtd}</span>
        <button data-op="+">+</button>
      </div>`;
    el.querySelectorAll("button").forEach(b => {
      b.onclick = () => alterarQtd(cat, item, b.dataset.op === "+" ? 1 : -1);
    });
  }
}

function totalCarrinho(){
  return Object.values(carrinho).reduce((s,i)=> s + i.preco*i.qtd, 0);
}
function qtdTotalCarrinho(){
  return Object.values(carrinho).reduce((s,i)=> s + i.qtd, 0);
}

function fmt(v){ return "R$ " + v.toFixed(2).replace(".",","); }

function atualizarUI(){
  // re-renderiza os steppers de todos os cards visíveis
  document.querySelectorAll(".qtd-area").forEach(el=>{
    const cat = el.dataset.cat, nome = el.dataset.nome;
    const grupo = CARDAPIO.find(g=>g.categoria===cat);
    const item = grupo.itens.find(i=>i.nome===nome);
    renderQtdArea(el, cat, item);
  });

  const total = totalCarrinho();
  const qtd = qtdTotalCarrinho();
  document.getElementById("bolhaQtd").textContent = qtd;
  document.getElementById("totalFlutuante").textContent = fmt(total);
  document.getElementById("sacolaFlutuante").classList.toggle("mostrar", qtd > 0);

  document.getElementById("subtotal").textContent = fmt(total);
  document.getElementById("total").textContent = fmt(total);

  const btn = document.getElementById("btnWhats");
  const obs = document.getElementById("obsMin");
  const drawerItens = document.getElementById("drawerItens");

  if(qtd === 0){
    drawerItens.innerHTML = `<div class="drawer-vazio">Sua sacola está vazia.<br>Adicione um docinho 🍓</div>`;
  } else {
    drawerItens.innerHTML = Object.entries(carrinho).map(([k,i])=>`
      <div class="drawer-item">
        ${i.img ? `<img src="${i.img}" alt="">` : `<div style="width:56px;height:56px;border-radius:12px;background:var(--blush);display:flex;align-items:center;justify-content:center;font-size:22px">🍓</div>`}
        <div class="info">
          <h4>${i.nome}</h4>
          <div class="linha">
            <span style="font-size:12.5px;color:#8A5D6C">${fmt(i.preco)} un.</span>
            <div class="stepper" data-k="${k}">
              <button data-op="-">−</button><span class="qtd">${i.qtd}</span><button data-op="+">+</button>
            </div>
          </div>
        </div>
      </div>`).join("");

    drawerItens.querySelectorAll(".stepper").forEach(st=>{
      const [cat, nomeItem] = st.dataset.k.split("::");
      const grupo = CARDAPIO.find(g=>g.categoria===cat);
      const item = grupo.itens.find(i=>i.nome===nomeItem);
      st.querySelectorAll("button").forEach(b=>{
        b.onclick = () => alterarQtd(cat, item, b.dataset.op==="+"?1:-1);
      });
    });
  }

  if(total < LOJA.pedidoMinimo && qtd > 0){
    btn.disabled = true;
    obs.textContent = `Faltam ${fmt(LOJA.pedidoMinimo - total)} para o pedido mínimo`;
  } else {
    btn.disabled = qtd === 0;
    obs.textContent = "";
  }
}

function abrirDrawer(){
  document.getElementById("drawer").classList.add("aberto");
  document.getElementById("overlay").classList.add("aberto");
}
function fecharDrawer(){
  document.getElementById("drawer").classList.remove("aberto");
  document.getElementById("overlay").classList.remove("aberto");
}

function finalizarPedido(){
  const total = totalCarrinho();
  if(qtdTotalCarrinho() === 0 || total < LOJA.pedidoMinimo) return;
  let msg = `Olá! Vim pelo cardápio digital e quero fazer um pedido:\n\n`;
  Object.values(carrinho).forEach(i=>{
    msg += `• ${i.qtd}x ${i.nome} — ${fmt(i.preco*i.qtd)}\n`;
  });
  msg += `\nTotal: ${fmt(total)}\n\nPor favor me confirme a forma de entrega/retirada. Obrigado(a)!`;
  const url = `https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
}

montarPagina();
atualizarUI();

// destaca chip da categoria visível
const chipsEls = () => Array.from(document.querySelectorAll(".chip"));
const secoes = () => Array.from(document.querySelectorAll("section.categoria"));
window.addEventListener("scroll", () => {
  let atualId = secoes()[0]?.id;
  secoes().forEach(s => { if(s.getBoundingClientRect().top < 140) atualId = s.id; });
  chipsEls().forEach(c => c.classList.toggle("ativo", c.getAttribute("href") === "#"+atualId));
}, { passive:true });
</script>
</body>
</html>
